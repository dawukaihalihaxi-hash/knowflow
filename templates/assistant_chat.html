<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-version" content="{{ app_version }}"><meta name="csrf-token" content="{{ csrf }}"><meta name="assistant-id" content="{{ assistant_id }}"><title>知识问答</title><link rel="stylesheet" href="/static/assistant.css?v={{ app_version }}"><link rel="stylesheet" id="assistant-theme" href="/a/{{ assistant_id }}/theme.css"></head><body class="chat-app"><aside class="chat-sidebar"><a href="/a/{{ assistant_id }}" class="chat-brand"><span class="assistant-icon" data-icon>✦</span><strong data-name>知识助手</strong></a><button id="new-chat" class="new-chat">＋ 开始新对话</button><div class="history-label">当前会话</div><button class="history-item" id="current-session">新的对话</button><div class="chat-sidebar-bottom"><span data-company>企业知识服务</span><p>对话仅保留在当前页面<br>每次提问独立回答</p></div></aside><div class="chat-main"><header><span data-name>知识助手</span><div>{% if public_demo %}<a class="manage-link" href="/admin">查看平台 ↗</a>{% endif %}{% if admin %}<a class="manage-link" href="/admin">工作台 ↗</a>{% endif %}{% if authenticated and not public_demo %}<button id="logout">退出</button>{% endif %}<span class="user-avatar">我</span></div></header><div id="draft-note" class="draft-note" hidden>这是助手预览。知识与服务准备好后，请在工作台启用。</div><main class="chat-content"><section id="chat-welcome" class="chat-welcome"><div class="hero-icon assistant-icon" data-icon>✦</div><h1 id="welcome-title">你好，有什么可以帮你？</h1><p id="welcome-subtitle"></p><p id="welcome-description" hidden></p><div id="suggestions" class="suggestions"></div></section><section id="chat-messages" class="chat-messages" aria-live="polite"></section></main><div class="chat-composer"><form id="chat-form"><label class="sr-only" for="chat-question">输入问题</label><textarea id="chat-question" rows="2" placeholder="输入你的问题…" maxlength="2000"></textarea><div><span id="composer-hint">基于企业知识回答 · 支持查看依据</span><button id="chat-send" type="submit" aria-label="发送问题">↑</button></div></form><small>AI可能理解有误，请结合引用原文核验重要事项。</small></div></div><dialog id="citations-dialog"><div class="citations-heading"><h2>回答依据</h2><button id="close-citations" aria-label="关闭引用">×</button></div><div id="citation-content"></div></dialog><script src="/static/http.js?v={{ app_version }}" defer></script><script src="/static/assistant.js?v={{ app_version }}" defer></script></body></html>
