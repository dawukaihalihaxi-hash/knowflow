<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-version" content="{{ app_version }}"><meta name="csrf-token" content="{{ csrf }}"><title>{{ platform_brand.name }} · 登录</title><link rel="icon" type="image/png" href="{{ platform_brand.logo_url }}"><link rel="stylesheet" href="/static/style.css?v={{ app_version }}"></head><body class="login-body"><main class="login-card"><img class="login-platform-logo" src="{{ platform_brand.logo_url }}" alt="{{ platform_brand.name }} Logo"><div class="eyebrow">PRIVATE WORKSPACE</div><h1>{{ platform_brand.name }}</h1><p>{{ platform_brand.slogan }}</p><p class="muted">{{ platform_brand.description }}</p><p class="muted">管理员登录后可管理样例。请使用网站管理员口令，不是电脑密码。</p><form id="login-form"><label for="password">管理员口令</label><input id="password" type="password" required autocomplete="current-password"><button class="primary-button" type="submit">进入工作空间 →</button><p id="login-error" role="alert"></p></form></main><script src="/static/login.js?v={{ app_version }}" defer></script></body></html>
